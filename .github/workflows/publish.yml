name: publish

# Runs when a GitHub release is published. Builds the package, runs the tests
# against the built wheel, and uploads to PyPI using trusted publishing (no
# API token stored in the repository).

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the built wheel
        run: |
          python -m pip install "$(ls dist/*.whl)[dev]"
          mv qthermo qthermo_src
          python -m pytest -q
          python -m qthermo.benchmarks --quick
          mv qthermo_src qthermo
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
